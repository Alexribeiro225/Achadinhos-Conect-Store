      {

      },
      {

        descricao_completa: 'Liberdade total com áudio de alta definição. O fone Bluetooth TWS entrega graves potentes, pareamento instantâneo via Bluetooth 5.3 e comandos sensíveis ao toque.',

        ],

        preco_venda: 59.90,
        preco_anterior: 99.90,
        margem_estimada: 33.90,
        link_checkout_kaiross: 'https://kaiross.com/checkout/fone-bluetooth-tws-led?ref=conectstore',

        secao_destaque: 'populares',
        ordem: 4,
        etiqueta_oferta: 'CAMPEÃO DE VENDAS',

        beneficios: ['Display numérico digital'],
        cliques: 0
      }
    ];

    // Helper para inicializar cliente Supabase no navegador
    function getSupabase() {
      try {
        const stored = localStorage.getItem('conect_supabase_config');
        if (stored) {
          const cfg = JSON.parse(stored);
          if (cfg.url && cfg.anonKey && window.supabase) {
            return window.supabase.createClient(cfg.url, cfg.anonKey);
          }
        }
      } catch (e) {
        console.error(e);
      }
      return null;
    }

    function App() {
      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem('conect_store_products_v2');
          return saved ? JSON.parse(saved) : DEMO_PRODUCTS;
        } catch {
          return DEMO_PRODUCTS;
        }
      });

      const [realClicksTotal, setRealClicksTotal] = useState(0);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [currentView, setCurrentView] = useState('home');
      const [activeProductSlug, setActiveProductSlug] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [adminEmail, setAdminEmail] = useState(null);
      const [modalLegal, setModalLegal] = useState(null);

      // Carregar dados remotos do Supabase se configurado
      const syncFromSupabase = async () => {
        const sb = getSupabase();
        if (sb) {
          try {
            // Verificar sessão
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
              const { data: adminRow } = await sb.from('admin_users').select('user_id').eq('user_id', user.id).maybeSingle();
              if (adminRow) {
                setIsAdmin(true);
                setAdminEmail(user.email);
              }
            }

            // Consultar produtos
            const { data: prods, error: pErr } = await sb.from('products').select('*').order('ordem', { ascending: true });
            if (!pErr && prods && prods.length > 0) {
              setProducts(prods);
              localStorage.setItem('conect_store_products_v2', JSON.stringify(prods));
            }

            // Contar cliques reais
            const { count } = await sb.from('click_events').select('*', { count: 'exact', head: true });
            if (count !== null) setRealClicksTotal(count);
          } catch (err) {
            console.warn('Sync Supabase:', err);
          }
        }
      };

      useEffect(() => {
        syncFromSupabase();
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('conect_store_products_v2', JSON.stringify(products));
        } catch (e) {}
      }, [products]);

      // Registro real de cliques e redirecionamento Kaiross
      const handleBuyNow = async (product, e) => {
        if (e) e.stopPropagation();

        // 1. Registrar em click_events no Supabase ou local
        const sb = getSupabase();
        if (sb) {
          sb.rpc('record_click', { p_product_id: product.id, p_source: 'storefront' }).catch(() => {
            sb.from('click_events').insert({ product_id: product.id, source: 'storefront' }).catch(() => {});
          });
        }

        // Atualizar estado local
        setRealClicksTotal(prev => prev + 1);
        setProducts(prev => prev.map(p => p.id === product.id ? { ...p, cliques: (p.cliques || 0) + 1 } : p));

        // 2. Abrir link individual cadastrado em nova aba
        if (product.link_checkout_kaiross) {
          window.open(product.link_checkout_kaiross, '_blank', 'noopener,noreferrer');
        } else {
          alert('Link Kaiross não configurado para este produto.');
        }
      };

      const navigateToDetail = (slug) => {
        setActiveProductSlug(slug);
        setCurrentView('detail');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const navigateToHome = () => {
        setCurrentView('home');
        setActiveProductSlug(null);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const navigateToAdmin = () => {
        setCurrentView('admin');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const activeProducts = products.filter(p => p.status === 'ativo');
      const activeProduct = products.find(p => p.slug === activeProductSlug);

      const stats = {
        total: products.length,
        ativos: activeProducts.length,
        pausados: products.filter(p => p.status === 'pausado').length,
        cliques: realClicksTotal,
        margemMedia: products.length > 0 ? (products.reduce((acc, p) => acc + (p.margem_estimada || 0), 0) / products.length) : 0
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#F5F5F5] text-[#171717]">
          {/* Top Micro Banner */}
          <div className="bg-gradient-to-r from-[#FF681B] via-[#FF8A3D] to-[#FFD43B] text-[#171717] py-1.5 px-4 text-xs font-bold text-center tracking-wide flex items-center justify-center gap-2">
            <span>🔥 ACHADINHOS EXCLUSIVOS &bull; OFERTAS COM ATÉ 60% OFF &bull; CHECKOUT SEGURO KAIROSS</span>
          </div>

          <header className="sticky top-0 z-40 bg-[#171717] text-white shadow-lg border-b border-[#262626]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20 gap-4">
                
                {/* Logo e Slogan */}
                <div onClick={navigateToHome} className="flex items-center gap-3 cursor-pointer select-none">

                    ⚡
                  </div>
                  <div className="flex flex-col">
                    <span className="text-xl sm:text-2xl font-extrabold tracking-tight leading-none text-white flex items-center gap-1.5">
                      CONECT <span className="text-[#FF681B]">STORE</span>
                      <span className="text-[10px] font-bold bg-[#FFD43B] text-[#171717] px-1.5 py-0.5 rounded-md uppercase ml-1">
                        OFERTAS 2.0
                      </span>
                    </span>
                    <span className="text-xs text-gray-300 font-medium mt-0.5">
                      Achou, gostou, aproveitou!
                    </span>
                  </div>
                </div>

                {/* Busca Desktop */}
                <div className="hidden md:flex flex-1 max-w-xl mx-4">
                  <div className="relative w-full">
                    <input
                      type="text"
                      value={searchTerm}
                      onChange={(e) => {
                        setSearchTerm(e.target.value);
                        if (currentView !== 'home') navigateToHome();
                      }}
                      placeholder="Buscar achadinhos, novidades, ofertas..."
                      className="w-full bg-[#262626] text-white placeholder-gray-400 pl-11 pr-10 py-2.5 rounded-full border border-gray-700 focus:outline-none focus:border-[#FF681B] text-sm"
                    />
                    <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
                    {searchTerm && (
                      <button onClick={() => setSearchTerm('')} className="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">✕</button>
                    )}
                  </div>
                </div>

                {/* Ações */}
                <div className="flex items-center gap-3">
                  <div className="hidden lg:flex items-center gap-1.5 text-xs text-gray-300 bg-[#222222] border border-gray-800 px-3 py-1.5 rounded-full">
                    <span>🛡️ Checkout Oficial <strong>Kaiross</strong></span>

                  <button
                    onClick={navigateToAdmin}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border ${
                      currentView === 'admin'
                        ? 'bg-[#FF681B] text-white border-[#FF681B]'
                        : 'bg-[#222222] text-gray-300 hover:text-white border-gray-700'
                    }`}
                  >
                    <span>🔒 {isAdmin ? 'Painel Admin' : 'Admin'}</span>
                  </button>
                </div>
              </div>

              {/* Busca Mobile */}
              <div className="md:hidden pb-3">
                <input
                  type="text"
                  value={searchTerm}
                  onChange={(e) => {
                    setSearchTerm(e.target.value);
                    if (currentView !== 'home') navigateToHome();
                  }}
                  placeholder="Buscar ofertas e achadinhos..."
                  className="w-full bg-[#262626] text-white placeholder-gray-400 px-4 py-2 rounded-full border border-gray-700 text-sm focus:outline-none focus:border-[#FF681B]"

              </div>

              {/* Categorias */}
              <nav className="hidden md:flex items-center justify-center gap-1 py-2.5 border-t border-[#262626] text-xs font-medium overflow-x-auto">
                <button
                  onClick={() => { setSelectedCategory(null); navigateToHome(); }}
                  className={`px-3.5 py-1.5 rounded-full transition whitespace-nowrap ${
                    selectedCategory === null ? 'bg-[#FF681B] text-white font-bold' : 'text-gray-300 hover:text-white hover:bg-[#262626]'
                  }`}
                >
                  Todos os Produtos
                </button>
                {INITIAL_CATEGORIES.map(c => (
                  <button
                    key={c.slug}
                    onClick={() => { setSelectedCategory(c.nome); navigateToHome(); }}
                    className={`px-3.5 py-1.5 rounded-full transition whitespace-nowrap ${
                      selectedCategory === c.nome ? 'bg-[#FF681B] text-white font-bold' : 'text-gray-300 hover:text-white hover:bg-[#262626]'
                    }`}
                  >
                    {c.nome}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* MAIN CONTENT ROUTING */}
          <main className="flex-1">
            {currentView === 'home' && (
              <HomeView
                products={activeProducts}
                totalAllProducts={products.length}
                searchTerm={searchTerm}
                setSearchTerm={setSearchTerm}
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                navigateToDetail={navigateToDetail}
                navigateToAdmin={navigateToAdmin}
                handleBuyNow={handleBuyNow}
              />
            )}

            {currentView === 'detail' && (
              <DetailView
                product={activeProduct}
                navigateToHome={navigateToHome}
                handleBuyNow={handleBuyNow}
              />
            )}

            {currentView === 'admin' && (
              <AdminView
                products={products}
                setProducts={setProducts}
                stats={stats}
                isAdmin={isAdmin}
                setIsAdmin={setIsAdmin}
                adminEmail={adminEmail}
                setAdminEmail={setAdminEmail}
                navigateToHome={navigateToHome}
              />
            )}
          </main>

          {/* Footer */}
          {currentView !== 'admin' && (
            <footer className="bg-[#171717] text-white pt-12 pb-8 border-t border-[#262626] mt-auto">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="mb-10 p-5 rounded-2xl bg-[#222222] border border-[#333333] flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                  <div className="space-y-1">
                    <h4 className="text-sm font-bold text-white flex items-center gap-2">
                      <span>🛡️ Aviso de Transparência e Isenção de Responsabilidade Comercial</span>
                      <span className="text-[10px] bg-[#FFD43B] text-[#171717] px-2 py-0.5 rounded font-black uppercase">Transparência</span>
                    </h4>
                    <p className="text-xs text-gray-400 max-w-3xl leading-relaxed">
                      A <strong>CONECT STORE OFERTAS</strong> atua exclusivamente como vitrine de curadoria e ofertas. Os pedidos, pagamentos e emissões fiscais são processados na infraestrutura segura da plataforma <strong>Kaiross</strong>. A loja pode receber remuneração por compras realizadas por esses links sem custo adicional para você.
                    </p>
                  </div>
                  <button
                    onClick={() => setModalLegal('afiliados')}
                    className="text-xs font-bold text-[#FFD43B] hover:text-white underline whitespace-nowrap"
                  >
                    Saiba mais
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-8 pb-10 border-b border-[#262626] text-xs">
                  <div className="space-y-3">
                    <span className="text-lg font-black text-white">CONECT <span className="text-[#FF681B]">STORE</span></span>
                    <p className="text-[#FFD43B] font-bold">"Achou, gostou, aproveitou!"</p>
                    <p className="text-gray-400">Curadoria especializada em novidades e produtos úteis para facilitar o seu dia a dia.</p>
                  </div>

                  <div className="space-y-2">
                    <h4 className="font-bold uppercase tracking-wider text-white">Atendimento</h4>
                    <p className="text-gray-300">WhatsApp: (11) 98765-4321</p>
                    <p className="text-gray-300">contato@conectstoreofertas.com</p>
                    <p className="text-gray-400">Seg. a Sex. das 09h às 18h</p>
                  </div>

                  <div className="space-y-2">
                    <h4 className="font-bold uppercase tracking-wider text-white">Institucional</h4>
                    <p><button onClick={() => setModalLegal('afiliados')} className="hover:text-[#FF681B]">Política de Afiliados</button></p>
                    <p><button onClick={() => setModalLegal('privacidade')} className="hover:text-[#FF681B]">Privacidade & LGPD</button></p>
                    <p><button onClick={() => setModalLegal('termos')} className="hover:text-[#FF681B]">Termos de Uso</button></p>
                    <p><button onClick={navigateToAdmin} className="text-gray-400 hover:text-[#FFD43B]">🔒 Painel Administrativo</button></p>
                  </div>

                  <div className="space-y-2">
                    <h4 className="font-bold uppercase tracking-wider text-white">Redes Sociais</h4>
                    <p className="text-gray-400">Acompanhe nossas novidades:</p>
                    <div className="flex gap-2">
                      <span className="px-2.5 py-1 bg-[#262626] rounded text-gray-200">Instagram</span>
                      <span className="px-2.5 py-1 bg-[#262626] rounded text-gray-200">TikTok</span>
                    </div>
                  </div>
                </div>

                <div className="pt-6 flex flex-col sm:flex-row items-center justify-between text-xs text-gray-400 gap-2">
                  <p>&copy; {new Date().getFullYear()} CONECT STORE OFERTAS. Todos os direitos reservados.</p>
                  <p>Ambiente Oficial Kaiross &bull; Supabase RLS Protected</p>
                </div>
              </div>
            </footer>
          )}

          {/* Modal Legal */}
          {modalLegal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 text-xs text-gray-600 space-y-4">

    // ADMIN VIEW COM SUPABASE AUTH & ADMIN_USERS
    function AdminView({ products, setProducts, stats, isAdmin, setIsAdmin, adminEmail, setAdminEmail, navigateToHome }) {
      const [emailInput, setEmailInput] = useState('');
      const [passInput, setPassInput] = useState('');
      const [loginError, setLoginError] = useState(null);
      const [loadingAuth, setLoadingAuth] = useState(false);
      const [supabaseConfig, setSupabaseConfig] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('conect_supabase_config') || '{"url":"","anonKey":""}');
        } catch {
          return { url: '', anonKey: '' };
        }
      });
      const [configMessage, setConfigMessage] = useState(null);
      const [modalEdit, setModalEdit] = useState(false);
      const [editingProd, setEditingProd] = useState(null);

      const handleSaveSupabaseConfig = (e) => {
        e.preventDefault();
        setConfigMessage(null);

        try {
          const url = new URL(supabaseConfig.url.trim());
          if (url.protocol !== 'https:' && url.hostname !== 'localhost') {
            setConfigMessage('A URL deve usar HTTPS (ou localhost para testes).');
            return;
          }
          if (!supabaseConfig.anonKey.trim()) {
            setConfigMessage('Informe a chave pública anon/publishable do Supabase.');
            return;
          }

          localStorage.setItem('conect_supabase_config', JSON.stringify({
            url: url.origin,
            anonKey: supabaseConfig.anonKey.trim()
          }));
          setSupabaseConfig({ url: url.origin, anonKey: supabaseConfig.anonKey.trim() });
          setConfigMessage('Configuração salva. Agora tente entrar com seu usuário administrador.');
        } catch {
          setConfigMessage('Informe uma URL válida do projeto Supabase, por exemplo https://seu-projeto.supabase.co.');
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError(null);
        setLoadingAuth(true);

        const sb = getSupabase();
        if (!sb) {
          setLoginError('Configure o Supabase primeiro informando a URL e Chave Anon.');
          setLoadingAuth(false);
          return;
        }

        try {
          const { data, error } = await sb.auth.signInWithPassword({
            email: emailInput.trim(),
            password: passInput
          });

          if (error) {
            setLoginError(error.message);
            setLoadingAuth(false);
            return;
          }

          if (data?.user) {
            // Verificar tabela admin_users
            const { data: adminRow, error: adminError } = await sb.from('admin_users').select('user_id').eq('user_id', data.user.id).maybeSingle();
            if (adminError) {
              await sb.auth.signOut();
              setLoginError(`Não foi possível verificar a permissão de administrador: ${adminError.message}`);
              setLoadingAuth(false);
              return;
            }
            if (!adminRow) {
              await sb.auth.signOut();
              setLoginError(`Acesso negado. UUID autenticado: ${data.user.id}. No SQL Editor do mesmo projeto Supabase, execute: INSERT INTO public.admin_users (user_id) VALUES ('${data.user.id}') ON CONFLICT (user_id) DO NOTHING;`);
              setLoadingAuth(false);
              return;
            }

            setIsAdmin(true);
            setAdminEmail(data.user.email);
          }
        } catch (err) {
          setLoginError(err.message);
        } finally {
          setLoadingAuth(false);
        }
      };

      if (!isAdmin) {
        return (
          <div className="min-h-[80vh] flex items-center justify-center p-4">
            <div className="bg-[#171717] text-white p-8 rounded-3xl max-w-sm w-full border border-gray-800 space-y-4 text-center">
              <span className="text-3xl">🔒</span>
              <h2 className="text-xl font-bold">Painel Administrativo 2.0</h2>
              <p className="text-xs text-gray-400">Protegido por Supabase Auth & admin_users</p>

              {!getSupabase() && (
                <form onSubmit={handleSaveSupabaseConfig} className="space-y-2 text-left bg-[#262626] border border-gray-700 rounded-xl p-3">
                  <p className="text-xs font-bold text-amber-300">Configure a conexão com o Supabase</p>
                  <input
                    type="url"
                    required
                    placeholder="https://seu-projeto.supabase.co"
                    value={supabaseConfig.url}
                    onChange={e => setSupabaseConfig({ ...supabaseConfig, url: e.target.value })}
                    className="w-full bg-[#171717] border border-gray-700 px-3 py-2 text-xs rounded-lg text-white"
                  />
                  <input
                    type="password"
                    required
                    placeholder="Chave pública anon/publishable (não use service_role)"
                    value={supabaseConfig.anonKey}
                    onChange={e => setSupabaseConfig({ ...supabaseConfig, anonKey: e.target.value })}
                    className="w-full bg-[#171717] border border-gray-700 px-3 py-2 text-xs rounded-lg text-white"
                    autoComplete="off"
                  />
                  {configMessage && <p className="text-xs text-amber-200">{configMessage}</p>}
                  <button type="submit" className="w-full py-2 bg-amber-400 text-black font-bold text-xs rounded-lg">
                    Salvar configuração
                  </button>
                </form>
              )}
              
              <form onSubmit={handleLogin} className="space-y-3 text-left">
                <div>
                  <label className="text-[10px] uppercase font-bold text-gray-400">E-mail</label>
                  <input
                    type="email"
                    required
                    placeholder="admin@conectstore.com"
                    value={emailInput}
                    onChange={e => setEmailInput(e.target.value)}
                    className="w-full bg-[#262626] border border-gray-700 px-3 py-2 text-xs rounded-xl text-white focus:outline-none focus:border-[#FF681B] mt-1"
                  />
                </div>
                <div>
                  <label className="text-[10px] uppercase font-bold text-gray-400">Senha</label>
                  <input
                    type="password"
                    required
                    placeholder="••••••••"
                    value={passInput}
                    onChange={e => setPassInput(e.target.value)}
                    className="w-full bg-[#262626] border border-gray-700 px-3 py-2 text-xs rounded-xl text-white focus:outline-none focus:border-[#FF681B] mt-1"
                  />
                </div>
                {loginError && <p className="text-xs text-red-400 p-2 bg-red-950/40 rounded-lg">{loginError}</p>}
                <button
                  type="submit"
                  disabled={loadingAuth}
                  className="w-full py-2.5 bg-[#FF681B] text-white font-bold text-xs rounded-xl shadow-brand disabled:opacity-50"
                >
                  {loadingAuth ? 'Autenticando...' : 'Entrar com Supabase'}
                </button>
              </form>

              <button onClick={navigateToHome} className="text-xs text-gray-400 hover:text-white pt-2 block mx-auto">
                Voltar para a Loja
              </button>
            </div>
          </div>
        );
      }

      const handleSave = async (e) => {
        e.preventDefault();
        const sb = getSupabase();
        if (sb) {
          await sb.from('products').upsert(editingProd);
        }
        const updated = products.some(p => p.id === editingProd.id)
          ? products.map(p => p.id === editingProd.id ? editingProd : p)
          : [editingProd, ...products];
        setProducts(updated);
        setModalEdit(false);
      };

      const handleToggle = async (id) => {
        const prod = products.find(p => p.id === id);
        if (!prod) return;
        const newStatus = prod.status === 'ativo' ? 'pausado' : 'ativo';
        const updatedProd = { ...prod, status: newStatus };
        const sb = getSupabase();
        if (sb) {
          await sb.from('products').update({ status: newStatus }).eq('id', id);
        }
        setProducts(products.map(p => p.id === id ? updatedProd : p));
      };

      const handleDelete = async (id) => {
        if (confirm('Excluir este produto?')) {
          const sb = getSupabase();
          if (sb) {
            await sb.from('products').delete().eq('id', id);
          }
          setProducts(products.filter(p => p.id !== id));
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
          <div className="flex justify-between items-center bg-white p-5 rounded-2xl border">
            <div>
              <h2 className="text-xl font-black text-[#171717]">Painel Administrativo Conect Store 2.0</h2>
              <p className="text-xs text-gray-500">Logado como: <strong>{adminEmail}</strong> &bull; RLS Habilitado</p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => {
                  setEditingProd({
                    id: crypto.randomUUID ? crypto.randomUUID() : 'prod-' + Date.now(),
                    nome: '',
                    slug: '',
                    descricao_curta: '',
                    descricao_completa: '',
                    categoria: 'Casa e cozinha',
                    imagens: [],
                    preco_custo: 0,
                    preco_venda: 0,
                    preco_anterior: null,
                    margem_estimada: 0,
                    link_checkout_kaiross: '',
                    status: 'pausado',
                    destaque: false,
                    secao_destaque: 'achadinhos',
                    ordem: products.length + 1,
                    etiqueta_oferta: 'OFERTA'
                  });
                  setModalEdit(true);
                }}
                className="px-4 py-2 bg-[#FF681B] text-white text-xs font-bold rounded-xl"
              >
                + Novo Produto
              </button>
              <button
                onClick={async () => {
                  const sb = getSupabase();
                  if (sb) await sb.auth.signOut();
                  setIsAdmin(false);
                  setAdminEmail(null);
                }}
                className="px-3 py-2 bg-gray-200 text-xs font-bold rounded-xl"
              >
                Sair
              </button>
            </div>
          </div>

          {/* KPIs Reais */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white p-4 rounded-2xl border">
              <span className="text-[10px] font-bold text-gray-400 uppercase">Produtos Ativos</span>
              <div className="text-2xl font-black text-green-600">{stats.ativos}</div>
            </div>
            <div className="bg-white p-4 rounded-2xl border">
              <span className="text-[10px] font-bold text-gray-400 uppercase">Produtos Pausados</span>
              <div className="text-2xl font-black text-gray-500">{stats.pausados}</div>
            </div>
            <div className="bg-white p-4 rounded-2xl border">
              <span className="text-[10px] font-bold text-gray-400 uppercase">Cliques Reais</span>
              <div className="text-2xl font-black text-[#FF681B]">{stats.cliques}</div>
            </div>
            <div className="bg-white p-4 rounded-2xl border">
              <span className="text-[10px] font-bold text-gray-400 uppercase">Margem Média Kaiross</span>
              <div className="text-2xl font-black text-[#171717]">R$ {stats.margemMedia.toFixed(2).replace('.', ',')}</div>
            </div>
          </div>

          {/* Tabela de Produtos */}
          <div className="bg-white rounded-2xl border overflow-x-auto">
            <table className="w-full text-left text-xs">
              <thead className="bg-gray-50 border-b text-[10px] text-gray-500 uppercase">
                <tr>
                  <th className="p-3">Nome</th>
                  <th className="p-3">Categoria</th>
                  <th className="p-3">Preço Venda</th>
                  <th className="p-3">Custo / Margem Est.</th>
                  <th className="p-3 text-center">Status</th>
                  <th className="p-3 text-right">Ações</th>
                </tr>
              </thead>
              <tbody className="divide-y">
                {products.map(p => (
                  <tr key={p.id} className="hover:bg-gray-50">
                    <td className="p-3 font-bold text-[#171717]">{p.nome}</td>
                    <td className="p-3">{p.categoria}</td>
                    <td className="p-3 font-bold">R$ {p.preco_venda.toFixed(2).replace('.', ',')}</td>
                    <td className="p-3 text-gray-500">Custo: R$ {p.preco_custo} | Margem: R$ {p.margem_estimada}</td>
                    <td className="p-3 text-center">
                      <button onClick={() => handleToggle(p.id)} className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${p.status === 'ativo' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'}`}>
                        {p.status}
                      </button>
                    </td>
                    <td className="p-3 text-right space-x-2">
                      <button onClick={() => { setEditingProd({ ...p }); setModalEdit(true); }} className="text-[#FF681B] font-bold">Editar</button>
                      <button onClick={() => handleDelete(p.id)} className="text-red-500 font-bold">Excluir</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Modal Edição */}
          {modalEdit && editingProd && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 text-xs space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="text-base font-bold text-[#171717]">Gerenciar Produto</h3>
                <form onSubmit={handleSave} className="space-y-3">
                  <div>
                    <label className="font-bold">Nome do Produto</label>
                    <input required value={editingProd.nome} onChange={e => setEditingProd({ ...editingProd, nome: e.target.value, slug: e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '-') })} className="w-full border p-2 rounded-xl mt-1" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold">Categoria</label>
                      <select value={editingProd.categoria} onChange={e => setEditingProd({ ...editingProd, categoria: e.target.value })} className="w-full border p-2 rounded-xl mt-1">
                        {INITIAL_CATEGORIES.map(c => <option key={c.slug} value={c.nome}>{c.nome}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold">Status</label>
                      <select value={editingProd.status} onChange={e => setEditingProd({ ...editingProd, status: e.target.value })} className="w-full border p-2 rounded-xl mt-1">
                        <option value="pausado">Pausado (Em auditoria)</option>
                        <option value="ativo">Ativo (Publicado)</option>
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="font-bold">Preço Venda (R$)</label>
                      <input type="number" step="0.01" required value={editingProd.preco_venda} onChange={e => setEditingProd({ ...editingProd, preco_venda: parseFloat(e.target.value) || 0 })} className="w-full border p-2 rounded-xl mt-1" />
                    </div>
                    <div>
                      <label className="font-bold">Preço Custo (R$)</label>
                      <input type="number" step="0.01" value={editingProd.preco_custo} onChange={e => setEditingProd({ ...editingProd, preco_custo: parseFloat(e.target.value) || 0 })} className="w-full border p-2 rounded-xl mt-1" />
                    </div>
                    <div>
                      <label className="font-bold">Margem Kaiross</label>
                      <input type="number" step="0.01" value={editingProd.margem_estimada} onChange={e => setEditingProd({ ...editingProd, margem_estimada: parseFloat(e.target.value) || 0 })} className="w-full border p-2 rounded-xl mt-1" />
                    </div>
                  </div>
                  <div>
                    <label className="font-bold">Link Individual Kaiross</label>
                    <input required value={editingProd.link_checkout_kaiross} onChange={e => setEditingProd({ ...editingProd, link_checkout_kaiross: e.target.value })} className="w-full border p-2 rounded-xl mt-1" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setModalEdit(false)} className="px-4 py-2 bg-gray-200 font-bold rounded-xl">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-[#FF681B] text-white font-bold rounded-xl">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
